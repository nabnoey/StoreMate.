$kind: http-request
name: Import Excel/CSV Sales Data
description: Upload a sales report spreadsheet (.xlsx, .xls, .csv). If the file
  contains invalid data or schema, it returns 400 Bad Request.
url: "{{baseUrl}}/owner/import"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      src: []
      description: Excel or CSV file to import. Select a file in Postman.
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 400", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 400]);
      });
      if (pm.response.code === 200) {
          pm.test("Successful import message", function () {
              pm.expect(pm.response.text()).to.be.a("string");
          });
      } else {
          pm.test("Shows validation error message", function () {
              const data = pm.response.json();
              pm.expect(data.message).to.exist;
          });
      }
    language: text/javascript
order: 3000
